plugins {
    id 'java'
    id("com.gradleup.shadow") version "9.3.1"
}

group = 'dev.oakheart'
version = '1.0.0'

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.3.build.+")
    implementation("dev.oakheart:oakheart-core:1.3.1")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

compileJava {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

shadowJar {
    relocate 'dev.oakheart.config', 'dev.oakheart.oakvillagers.libs.config'
    relocate 'dev.oakheart.message', 'dev.oakheart.oakvillagers.libs.message'
    relocate 'dev.oakheart.command', 'dev.oakheart.oakvillagers.libs.command'
    relocate 'dev.oakheart.util', 'dev.oakheart.oakvillagers.libs.util'
    archiveClassifier.set('')
}

build {
    dependsOn shadowJar
}
